<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0759b8">
  <title>SanibossXM - Data & Wallet</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f6fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #0759b8, #00a6ff);
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      font-weight: 800;
    }

    header p {
      margin-top: 6px;
      opacity: .95;
    }

    .container {
      width: 94%;
      max-width: 900px;
      margin: 20px auto;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h2 {
      color: #0759b8;
      margin-bottom: 15px;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccd6e0;
      font-size: 15px;
    }

    button {
      background: #0759b8;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #06458e;
    }

    .wallet {
      background: linear-gradient(135deg, #0759b8, #00a6ff);
      color: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 18px;
    }

    .wallet small {
      opacity: .9;
    }

    .balance {
      font-size: 34px;
      font-weight: bold;
      margin-top: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .bundle {
      border: 1px solid #dce4ec;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      background: #fff;
    }

    .bundle strong {
      display: block;
      font-size: 19px;
      color: #0759b8;
      margin-bottom: 5px;
    }

    .price {
      margin: 8px 0;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .logout {
      background: #dc3545;
      margin-top: 10px;
    }

    .logout:hover {
      background: #b02a37;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #eef6ff;
      color: #0759b8;
      display: none;
    }

    .transaction {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
      font-size: 13px;
    }

    @media(max-width: 500px) {
      header h1 {
        font-size: 25px;
      }

      .balance {
        font-size: 28px;
      }
    }
  </style></head><body><header>
  <h1>SANIBOSSXM</h1>
  <p>Fast Data • Easy Payments • Reliable Service</p>
</header><div class="container">  <section id="authSection" class="card">
    <h2>Customer Account</h2><input id="name" type="text" placeholder="Full name">
<input id="phone" type="tel" placeholder="Phone number">
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Create Account</button>
<button onclick="login()">Login</button>

<div id="authMessage" class="message"></div>

  </section>  <section id="dashboard" class="hidden"><div class="wallet">
  <small>Wallet Balance</small>
  <div class="balance">₦<span id="balance">0.00</span></div>
  <p id="welcome" style="margin-top:8px;"></p>
</div>


<div class="card">
  <h2>Fund Wallet</h2>

  <input
    id="depositAmount"
    type="number"
    min="100"
    placeholder="Enter amount"
  >

  <button onclick="deposit()">Deposit</button>

  <div id="depositMessage" class="message"></div>
</div>


<div class="card">
  <h2>Buy Data</h2>

  <select id="network">
    <option value="">Select Network</option>
    <option value="MTN">MTN</option>
    <option value="GLO">GLO</option>
    <option value="Airtel">Airtel</option>
    <option value="9mobile">9mobile</option>
  </select>

  <input
    id="dataPhone"
    type="tel"
    placeholder="Recipient phone number"
  >

  <div class="grid">

    <div class="bundle">
      <strong>500MB</strong>
      <div class="price">₦450</div>
      <button onclick="buyData('500MB',450)">Buy</button>
    </div>

    <div class="bundle">
      <strong>1GB</strong>
      <div class="price">₦900</div>
      <button onclick="buyData('1GB',900)">Buy</button>
    </div>

    <div class="bundle">
      <strong>2GB</strong>
      <div class="price">₦1,800</div>
      <button onclick="buyData('2GB',1800)">Buy</button>
    </div>

  </div>

  <div id="dataMessage" class="message"></div>
</div>


<div class="card">
  <h2>Transaction History</h2>

  <div id="transactions">
    <p>No transactions yet.</p>
  </div>
</div>

<button class="logout" onclick="logout()">Logout</button>

  </section></div><footer>
  © 2026 SanibossXM. All rights reserved.
</footer><script>

const BACKEND_URL =
  "https://sanibossxm-backend-3.onrender.com";

let currentUser = null;


/* =========================
   PAGE START
========================= */

window.onload = async function() {

  const savedUser =
    localStorage.getItem("saniboss_user");

  if (savedUser) {

    currentUser =
      JSON.parse(savedUser);

    showDashboard();

    /*
      Check whether Paystack has
      returned the customer to the website.
    */

    await verifyPaystackPayment();
  }
};


/* =========================
   MESSAGE
========================= */

function showMessage(id, text) {

  const box =
    document.getElementById(id);

  box.innerText = text;

  box.style.display = "block";
}


/* =========================
   REGISTER
========================= */

function register() {

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if (!name || !phone || !email || !password) {

    showMessage(
      "authMessage",
      "Please fill in all fields."
    );

    return;
  }


  currentUser = {

    name: name,

    phone: phone,

    email: email,

    password: password,

    balance: 0,

    transactions: []
  };


  localStorage.setItem(
    "saniboss_user",
    JSON.stringify(currentUser)
  );


  showMessage(
    "authMessage",
    "Account created successfully."
  );


  showDashboard();
}


/* =========================
   LOGIN
========================= */

function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  const savedUser =
    localStorage.getItem("saniboss_user");


  if (!savedUser) {

    showMessage(
      "authMessage",
      "No account found. Please register first."
    );

    return;
  }


  const user =
    JSON.parse(savedUser);


  if (
    user.email !== email ||
    user.password !== password
  ) {

    showMessage(
      "authMessage",
      "Incorrect email or password."
    );

    return;
  }


  currentUser = user;

  showDashboard();
}


/* =========================
   DASHBOARD
========================= */

function showDashboard() {

  document
    .getElementById("authSection")
    .classList.add("hidden");


  document
    .getElementById("dashboard")
    .classList.remove("hidden");


  document.getElementById("welcome").innerText =
    "Welcome, " + currentUser.name;


  updateBalance();

  showTransactions();
}


/* =========================
   BALANCE
========================= */

function updateBalance() {

  document.getElementById("balance").innerText =

    Number(
      currentUser.balance || 0
    ).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2
      }
    );
}


/* =========================
   PAYSTACK DEPOSIT
========================= */

async function deposit() {

  const amount =
    Number(
      document.getElementById("depositAmount").value
    );


  if (!amount || amount < 100) {

    showMessage(
      "depositMessage",
      "Minimum deposit is ₦100."
    );

    return;
  }


  if (!currentUser || !currentUser.email) {

    showMessage(
      "depositMessage",
      "Please login first."
    );

    return;
  }


  try {

    showMessage(
      "depositMessage",
      "Connecting to Paystack..."
    );


    const reference =
      "SANIBOSS-" +
      Date.now();


    const response =
      await fetch(
        BACKEND_URL +
        "/api/payment/initialize",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            email:
              currentUser.email,

            amount:
              amount,

            reference:
              reference,

            callback_url:
              window.location.href

          })
        }
      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Payment initialization failed."
      );
    }


    if (
      result.data &&
      result.data.authorization_url
    ) {

      /*
        Save the amount locally so that
        the callback page knows what the
        customer intended to deposit.
      */

      localStorage.setItem(
        "saniboss_pending_payment",
        JSON.stringify({
          reference: reference,
          amount: amount
        })
      );


      window.location.href =
        result.data.authorization_url;

    } else {

      throw new Error(
        "Paystack did not return a payment URL."
      );
    }


  } catch (error) {

    console.error(error);


    showMessage(
      "depositMessage",
      "Payment error: " +
      error.message
    );
  }
}


/* =========================
   VERIFY PAYSTACK PAYMENT
========================= */

async function verifyPaystackPayment() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const reference =
    params.get("reference");


  if (!reference) {
    return;
  }


  if (!currentUser) {
    return;
  }


  showMessage(
    "depositMessage",
    "Verifying your Paystack payment..."
  );


  try {

    const response =
      await fetch(
        BACKEND_URL +
        "/api/payment/verify/" +
        encodeURIComponent(reference)
      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success ||
      !result.paid
    ) {

      showMessage(
        "depositMessage",
        result.message ||
        "Payment was not completed."
      );

      return;
    }


    const pending =
      JSON.parse(
        localStorage.getItem(
          "saniboss_pending_payment"
        ) || "null"
      );


    /*
      The backend has confirmed that
      Paystack marked the transaction
      successful.
    */

    if (
      pending &&
      pending.reference === reference
    ) {

      const amount =
        Number(pending.amount);


      /*
        IMPORTANT:
        This is still browser/demo wallet
        accounting. A real production wallet
        must be credited by the backend/database.
      */

      currentUser.balance =
        Number(currentUser.balance || 0) +
        amount;


      currentUser.transactions.unshift({

        type:
          "Wallet Deposit",

        amount:
          amount,

        reference:
          reference,

        date:
          new Date().toLocaleString()

      });


      saveUser();

      updateBalance();

      showTransactions();


      localStorage.removeItem(
        "saniboss_pending_payment"
      );


      showMessage(
        "depositMessage",
        "Payment successful! ₦" +
        amount.toLocaleString() +
        " has been added to your demo wallet."
      );
    }


    /*
      Remove the Paystack reference from
      the browser address bar.
    */

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );


  } catch (error) {

    console.error(error);


    showMessage(
      "depositMessage",
      "Could not verify payment: " +
      error.message
    );
  }
}


/* =========================
   BUY DATA
========================= */

function buyData(bundle, price) {

  const network =
    document.getElementById("network").value;


  const phone =
    document.getElementById("dataPhone")
    .value.trim();


  if (!network) {

    showMessage(
      "dataMessage",
      "Please select a network."
    );

    return;
  }


  if (!phone) {

    showMessage(
      "dataMessage",
      "Enter the recipient phone number."
    );

    return;
  }


  if (currentUser.balance < price) {

    showMessage(
      "dataMessage",
      "Insufficient wallet balance."
    );

    return;
  }


  /*
    DEMO PURCHASE ONLY.
    Real data vending will be connected
    through the backend later.
  */

  currentUser.balance -= price;


  currentUser.transactions.unshift({

    type:
      network + " " + bundle,

    phone:
      phone,

    amount:
      -price,

    date:
      new Date().toLocaleString()

  });


  saveUser();

  updateBalance();

  showTransactions();


  showMessage(
    "dataMessage",
    "Demo order created successfully."
  );
}


/* =========================
   TRANSACTIONS
========================= */

function showTransactions() {

  const box =
    document.getElementById(
      "transactions"
    );


  if (
    !currentUser.transactions ||
    currentUser.transactions.length === 0
  ) {

    box.innerHTML =
      "<p>No transactions yet.</p>";

    return;
  }


  box.innerHTML =

    currentUser.transactions

    .map(function(tx) {

      const amount =

        Number(tx.amount) >= 0

          ? "+₦" +
            Number(
              tx.amount
            ).toLocaleString()

          : "-₦" +
            Math.abs(
              Number(tx.amount)
            ).toLocaleString();


      return `

        <div class="transaction">

          <strong>
            ${tx.type}
          </strong>

          <br>

          ${
            tx.phone
            ? "Phone: " +
              tx.phone +
              "<br>"
            : ""
          }

          Amount:
          ${amount}

          <br>

          ${
            tx.reference
            ? "Reference: " +
              tx.reference +
              "<br>"
            : ""
          }

          <small>
            ${tx.date}
          </small>

        </div>

      `;

    })

    .join("");
}


/* =========================
   SAVE USER
========================= */

function saveUser() {

  localStorage.setItem(
    "saniboss_user",
    JSON.stringify(currentUser)
  );
}


/* =========================
   LOGOUT
========================= */

function logout() {

  currentUser = null;

  localStorage.removeItem(
    "saniboss_user"
  );

  location.reload();
}

</script></body>
</html>
