<script>
const API_BASE_URL = "https://sanibossxm-backend-3.onrender.com";

// Register a new customer
async function registerCustomer(name, email, password) {
  const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name,
      email,
      password
    })
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.message || "Registration failed");
  }

  return data;
}

// Login customer
async function loginCustomer(email, password) {
  const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      email,
      password
    })
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.message || "Login failed");
  }

  // Save login token
  localStorage.setItem("saniboss_token", data.token);

  return data;
}

// Get logged-in customer's account
async function getMyAccount() {
  const token = localStorage.getItem("saniboss_token");

  if (!token) {
    throw new Error("You are not logged in");
  }

  const response = await fetch(`${API_BASE_URL}/api/me`, {
    headers: {
      "Authorization": `Bearer ${token}`
    }
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.message || "Unable to load account");
  }

  return data;
}

// Logout
function logoutCustomer() {
  localStorage.removeItem("saniboss_token");
  location.reload();
}

console.log("SanibossXM connected to backend:", API_BASE_URL);
</script>
